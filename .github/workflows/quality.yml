name: Offline quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node scripts/test.js --frontend
      - name: Original-fixture retrieval diagnostics (no paid APIs)
        run: python -m scripts.check_quality --repeats 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-fixture-results-${{ matrix.os }}
          path: test-results/f-quality/
          if-no-files-found: warn
          retention-days: 14
