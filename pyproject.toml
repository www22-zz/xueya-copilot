[project]
name = "xueya-copilot"
version = "2.0.0"
description = "API-only course learning backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.2", "uvicorn==0.54.0", "pydantic==2.14.1",
  "httpx==0.28.1", "mcp==2.3.0", "jsonschema==4.26.0",
  "pypdf==6.20.1", "python-docx==1.2.0", "tzdata==2026.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
filterwarnings = ["error::ResourceWarning"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.xueya" = ["data/*.json", "sql/*.sql"]
